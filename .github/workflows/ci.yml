name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: CI only reads the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build and Test
    # Linux only for now.
    runs-on: ubuntu-latest

    steps:
      # Supply chain: every action is pinned to a full commit SHA (tags are mutable); the trailing
      # comment names the release the SHA belongs to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json pins the SDK (latestPatch roll-forward)
          global-json-file: global.json

      # Cache NuGet packages — keyed on Directory.Packages.props + all .csproj files
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Projects outside the solution must keep compiling.
      - name: Build samples and fuzz project
        run: |
          dotnet build samples/MigrationSamples --configuration Release
          dotnet build tests/ModernLibs.FileHelpers.Fuzz.Tests --configuration Release

      # SDK 10 + Microsoft.Testing.Platform: run the test binaries directly. MTP exits with code 8
      # when no test ran, which fails the job.
      - name: Test (TUnit)
        run: ./tests/ModernLibs.FileHelpers.Tests/bin/Release/net10.0/ModernLibs.FileHelpers.Tests

      # The xUnit v3 runner exits 0 when no test ran, so require a non-zero total.
      - name: Test (xUnit mutation)
        run: |
          set -o pipefail
          ./tests/ModernLibs.FileHelpers.Mutation.Tests/bin/Release/net10.0/ModernLibs.FileHelpers.Mutation.Tests | tee mutation-tests.log
          grep -Eq 'Total: [1-9][0-9]*' mutation-tests.log || { echo "::error::No mutation tests ran."; exit 1; }

      # The migration sample runs end to end (exit code 0).
      - name: Run migration sample
        run: dotnet run --project samples/MigrationSamples --configuration Release --no-build

      # Stryker.NET runs in mutation.yml (manual and weekly), not on every push.
