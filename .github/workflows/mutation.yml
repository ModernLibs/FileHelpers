name: Mutation Testing

# Stryker.NET takes far longer than the rest of CI, so it runs on demand and once a week instead of on
# every push. Stryker runs on the TUnit project through the Microsoft.Testing.Platform runner
# ("test-runner": "mtp" in stryker-config.json, preview in Stryker 5.1). Informational until one full
# workflow_dispatch run has shown the score, the timeout and Dubious counts, and the wall time; a
# follow-up then removes continue-on-error and sets "break" in stryker-config.json from that score.
#
# Scope: the full "mutate" list in stryker-config.json (1326 mutants to test, 4041 created) did not finish
# in 120 minutes, so a run mutates only the files named by the `mutate` input (comma-separated Stryker
# --mutate globs; the command line overrides the "mutate" list of the config file). The manual default is
# the two files part 2 edits. The weekly schedule has no inputs and uses the same two files plus
# FixedLengthSlicer.cs (the fallback in the MUTATE expression below) until the wall time of a full-scope run is known.
on:
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Comma-separated Stryker --mutate globs (one --mutate per glob)'
        type: string
        default: '**/Parsing/QuoteBalanceScanner.cs,**/Engines/RecordReadCore.cs'
  schedule:
    - cron: '0 3 * * 1'

# Least-privilege token: the workflow only reads the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  stryker:
    name: Stryker.NET
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # Supply chain: every action is pinned to a full commit SHA (tags are mutable); the trailing
      # comment names the release the SHA belongs to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # global.json pins SDK 11 (latestPatch roll-forward); 10.0.x provides the net10.0 runtime that
      # Stryker runs the tests on ("target-framework": "net10.0" in stryker-config.json).
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # dotnet-stryker is a local tool; its version is pinned in dotnet-tools.json.
      - name: Install Stryker.NET
        run: dotnet tool restore

      - name: Mutation Test (Stryker.NET)
        continue-on-error: true
        # "configuration": "Release" in stryker-config.json makes Stryker build and test Release.
        # The "dots" reporter prints one character per finished mutant (. killed, T timeout, S survived,
        # E error); the perl filter ends a line, with a time stamp, after every 100 characters, so a
        # run that is cancelled by the timeout still shows how far it got. The scope goes in through the
        # environment, never into the script text, and `set -f` stops the shell expanding the globs.
        shell: bash
        run: |
          set -euo pipefail
          set -f
          args=()
          IFS=',' read -r -a globs <<< "$MUTATE"
          for glob in "${globs[@]}"; do
            args+=(--mutate "$glob")
          done
          echo "Mutation scope: ${args[*]}"
          dotnet stryker --config-file stryker-config.json "${args[@]}" 2>&1 \
            | perl -e '$| = 1; $n = 0; while (read(STDIN, $c, 1)) { print $c; if ($c eq "\n") { $n = 0 } elsif (++$n >= 100) { @t = gmtime; printf " [%02d:%02d:%02d]\n", $t[2], $t[1], $t[0]; $n = 0 } }'
        env:
          DOTNET_ROOT: ${{ runner.tool_cache }}/dotnet
          # The fallback after || applies when the run has no input (the weekly schedule).
          MUTATE: ${{ inputs.mutate || '**/Parsing/QuoteBalanceScanner.cs,**/Engines/RecordReadCore.cs,**/Parsing/FixedLengthSlicer.cs' }}

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: StrykerOutput/
          retention-days: 30
