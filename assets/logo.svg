<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow / Frame -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- File Base Shape -->
  <path d="M140 100 H300 L370 170 V410 C370 421 361 430 350 430 H140 C129 430 120 421 120 410 V120 C120 109 129 100 140 100 Z" fill="#334155" opacity="0.5" />
  <path d="M150 110 H290 L360 180 V400 C360 405.5 355.5 410 350 410 H150 C144.5 410 140 405.5 140 400 V120 C140 114.5 144.5 110 150 110 Z" fill="#0F172A" stroke="#475569" stroke-width="6" />

  <!-- Folded Corner -->
  <path d="M290 110 V180 H360 Z" fill="url(#accentGrad)" />

  <!-- Data Grid / Columns (Delimited Records) -->
  <rect x="170" y="210" width="45" height="12" rx="4" fill="#64748B" />
  <rect x="225" y="210" width="65" height="12" rx="4" fill="#64748B" />
  <rect x="300" y="210" width="30" height="12" rx="4" fill="#64748B" />

  <rect x="170" y="235" width="35" height="12" rx="4" fill="#475569" />
  <rect x="215" y="235" width="75" height="12" rx="4" fill="#475569" />
  <rect x="300" y="235" width="30" height="12" rx="4" fill="#475569" />

  <!-- Fast Performance Chevrons (High Speed Parser) -->
  <path d="M190 280 L280 340 L190 400" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M260 280 L350 340 L260 400" fill="none" stroke="url(#speedGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>