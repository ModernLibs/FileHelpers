name: Publish

# Publishes ModernLibs.FileHelpers to nuget.org with NuGet Trusted Publishing (OIDC, no stored API key).
#
# Publish rule (both must hold, otherwise the run fails before packing):
#   1. The release version (tag without the leading "v") equals <Version> in
#      src/ModernLibs.FileHelpers/ModernLibs.FileHelpers.csproj at the tagged commit.
#   2. The release version is >= MIN_VERSION (4.8.0, the first NuGet release).
# The milestone versions 4.0.0 ... 4.7.0 were never released on NuGet and fail rule 2, so this
# workflow never publishes them (for example through workflow_dispatch). A re-pushed milestone tag
# (v4.3.0 on) runs the older publish.yml of its own commit instead, which has no rule 2 and pushes
# with a NUGET_API_KEY secret; it cannot publish only because that secret does not exist. Do not
# create it - see the fallback note at the end of this file.
#
# Triggers:
#   - push of a tag v*        -> validate, build, test, pack, publish, create the GitHub release
#   - workflow_dispatch (tag) -> same for an existing tag; dry_run (default) stops after packing
#
# Every action is pinned to a full commit SHA (tags are mutable); the trailing comment names the
# release the SHA belongs to.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, e.g. v4.8.0'
        required: true
        type: string
      dry_run:
        description: 'Build, test and pack only (do not publish or create a release)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  MIN_VERSION: '4.8.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0  # SourceLink / repository commit metadata

      - name: Resolve and validate version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          VERSION="${TAG#v}"

          CSPROJ_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ModernLibs.FileHelpers/ModernLibs.FileHelpers.csproj | head -n 1)
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match <Version>$CSPROJ_VERSION</Version> in ModernLibs.FileHelpers.csproj."
            exit 1
          fi

          CORE="${VERSION%%-*}"
          LOWEST=$(printf '%s\n%s\n' "$MIN_VERSION" "$CORE" | sort -V | head -n 1)
          if [ "$LOWEST" != "$MIN_VERSION" ]; then
            echo "::error::Version $VERSION is below the first NuGet release $MIN_VERSION (milestone tags are never published)."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Release $VERSION (tag $TAG, prerelease=$PRERELEASE)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # The version is passed to the build (not only to pack) so the DLLs are stamped with it
      # (AssemblyVersion, FileVersion, InformationalVersion).
      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      # Microsoft.Testing.Platform exits with code 8 when no test ran; that fails the job.
      - name: Test (TUnit)
        run: ./tests/ModernLibs.FileHelpers.Tests/bin/Release/net10.0/ModernLibs.FileHelpers.Tests

      # The xUnit v3 runner exits 0 when no test ran, so require a non-zero total.
      - name: Test (xUnit mutation)
        run: |
          set -o pipefail
          ./tests/ModernLibs.FileHelpers.Mutation.Tests/bin/Release/net10.0/ModernLibs.FileHelpers.Mutation.Tests | tee mutation-tests.log
          grep -Eq 'Total: [1-9][0-9]*' mutation-tests.log || { echo "::error::No mutation tests ran."; exit 1; }

      # Only the library is packed: the source generator ships inside it (analyzers/dotnet/cs).
      - name: Pack
        run: >-
          dotnet pack src/ModernLibs.FileHelpers/ --no-build --configuration Release
          -p:Version=${{ steps.version.outputs.version }} --output nupkgs

      - name: Verify package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la nupkgs/
          PKG="nupkgs/ModernLibs.FileHelpers.$VERSION.nupkg"
          test -f "$PKG"
          test -f "nupkgs/ModernLibs.FileHelpers.$VERSION.snupkg"
          test "$(ls nupkgs/*.nupkg | wc -l)" -eq 1
          unzip -l "$PKG" | tee package-contents.txt
          for entry in lib/net10.0/ModernLibs.FileHelpers.dll analyzers/dotnet/cs/ModernLibs.FileHelpers.Generator.dll buildTransitive/ModernLibs.FileHelpers.props README.md; do
            grep -q " $entry\$" package-contents.txt || { echo "::error::$entry missing from the package."; exit 1; }
          done
          unzip -p "$PKG" ModernLibs.FileHelpers.nuspec | grep -q "<version>$VERSION</version>"
          mkdir -p verify && unzip -q -o "$PKG" lib/net10.0/ModernLibs.FileHelpers.dll -d verify
          strings -a -el verify/lib/net10.0/ModernLibs.FileHelpers.dll | grep -A1 -x 'ProductVersion' | grep -q "^$VERSION" \
            || { echo "::error::ModernLibs.FileHelpers.dll is not stamped with $VERSION."; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: nupkgs/
          retention-days: 30

  publish:
    name: Publish to nuget.org
    needs: pack
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    # Optional extra gate: configure protection rules (required reviewers, tag pattern v*) on this
    # environment in the repository settings, and name it in the nuget.org trusted publishing policy.
    environment: nuget
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: nupkgs

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Exchanges the OIDC token for a short-lived (1 hour) nuget.org API key.
      # NUGET_USER is the nuget.org profile name (not the e-mail address) of the policy owner.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The key goes through an environment variable, not an expression expanded into the script.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.pack.outputs.tag }}
          files: nupkgs/*.nupkg
          prerelease: ${{ needs.pack.outputs.prerelease }}
          generate_release_notes: true

      # Fallback (long-lived API key) - only if Trusted Publishing is unavailable. Creating the
      # NUGET_API_KEY secret also lets the old publish.yml of the milestone tags push, so prefer
      # Trusted Publishing.
      # - name: Push to nuget.org (API key fallback)
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   run: >-
      #     dotnet nuget push "nupkgs/*.nupkg"
      #     --api-key "$NUGET_API_KEY"
      #     --source https://api.nuget.org/v3/index.json
      #     --skip-duplicate
