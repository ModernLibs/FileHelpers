name: Mutation Testing

# Stryker.NET takes far longer than the rest of CI, so it runs on demand and once a week instead of on
# every push. Informational only for now: with Stryker.NET 5.0 and the xUnit v3 project every mutant is
# reported as survived (score 0 %, coverage capture fails), so the break threshold cannot gate anything.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# Least-privilege token: the workflow only reads the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  stryker:
    name: Stryker.NET
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Supply chain: every action is pinned to a full commit SHA (tags are mutable); the trailing
      # comment names the release the SHA belongs to.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json pins the SDK (latestPatch roll-forward)
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker --version 5.0.0

      - name: Mutation Test (Stryker.NET)
        continue-on-error: true
        run: dotnet stryker --config-file stryker-config.json
        env:
          DOTNET_ROOT: ${{ runner.tool_cache }}/dotnet

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: StrykerOutput/
          retention-days: 30
